@if (currentUser$ | async; as user) {
  <header class="app-header sticky-top shadow-sm">
    <div class="d-flex align-items-center">
      <button 
        class="btn btn-icon d-lg-none me-3" 
        type="button" 
        data-bs-toggle="offcanvas" 
        [attr.data-bs-target]="'#' + themeColor + 'MobileMenu'" 
        [attr.aria-controls]="themeColor + 'MobileMenu'">
        <i class="fas fa-bars"></i>
      </button>
      <h1 class="h5 mb-0 fw-semibold">{{ pageTitle }}</h1>
    </div>
    <div class="d-flex align-items-center">
      <div class="d-flex align-items-center me-3">
        <img [src]="user.details?.avatarUrl" alt="User Avatar" class="rounded-circle me-2" width="36" height="36">
        <span class="fw-medium d-none d-sm-block">{{ user.firstName }} {{ user.lastName }}</span>
      </div>
      <button [class]="logoutButtonClasses" (click)="logout()">
        Logout
      </button>
    </div>
  </header>
}

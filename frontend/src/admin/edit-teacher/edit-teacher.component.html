
@if (teacher) {
  <div class="card shadow-sm">
    <div class="card-body p-4 p-lg-5">
      <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3">
        <h2 class="card-title h3">{{ pageTitle }}</h2>
        <a routerLink="/admin/manage-teachers" class="btn btn-secondary btn-sm">
          <i class="fas fa-arrow-left me-2"></i>Back to List
        </a>
      </div>
      <form #teacherForm="ngForm" (ngSubmit)="saveTeacher()">
        
        <!-- Profile Picture Section -->
        <fieldset class="mb-4">
          <legend class="h5 fw-semibold text-dark mb-3">Profile Picture</legend>
          <div class="row g-3">
            <div class="col-12 text-center">
              <div class="position-relative d-inline-block">
                <img [src]="profilePic || 'https://via.placeholder.com/150?text=No+Photo'" 
                     alt="Teacher Photo" 
                     class="rounded-circle border border-4 border-light shadow-sm"
                     style="width: 150px; height: 150px; object-fit: cover;">
                <label for="profilePicInput" class="position-absolute bottom-0 end-0 d-flex align-items-center justify-content-center bg-primary text-white rounded-circle"
                       style="width: 36px; height: 36px; cursor: pointer; border: 2px solid white;">
                  <i class="fas fa-camera"></i>
                </label>
                <input id="profilePicInput" type="file" class="d-none" (change)="onProfilePicChange($event)" accept="image/*">
              </div>
              <p class="text-muted small mt-2 mb-0">Click camera icon to upload photo (Max 10MB)</p>
            </div>
          </div>
        </fieldset>

        <fieldset class="vstack gap-4">
          <legend class="h5 fw-semibold text-dark mb-3">Personal Details</legend>
          <div class="row g-3">
            <div class="col-md-4">
                <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
                <input id="firstName" type="text" [(ngModel)]="teacher.firstName" name="firstName" required class="form-control">
            </div>
            <div class="col-md-4">
                <label for="middleName" class="form-label">Middle Name</label>
                <input id="middleName" type="text" [(ngModel)]="teacher.middleName" name="middleName" class="form-control">
            </div>
            <div class="col-md-4">
                <label for="lastName" class="form-label">Last Name <span class="text-danger">*</span></label>
                <input id="lastName" type="text" [(ngModel)]="teacher.lastName" name="lastName" required class="form-control">
            </div>
            <div class="col-md-6">
                <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                <input id="email" type="email" [(ngModel)]="teacher.email" name="email" required class="form-control">
            </div>
            <div class="col-md-6">
                <label for="mobile" class="form-label">Mobile Number</label>
                <input id="mobile" type="tel" [(ngModel)]="teacher.details.mobile" name="mobile" class="form-control">
            </div>
            <div class="col-md-6">
                <label for="dob" class="form-label">Date of Birth</label>
                <input id="dob" type="date" [(ngModel)]="teacher.details.dob" name="dob" [max]="today" class="form-control">
            </div>
            <div class="col-md-6">
                <label for="joiningDate" class="form-label">Joining Date</label>
                <input id="joiningDate" type="date" [(ngModel)]="teacher.details.joiningDate" name="joiningDate" [max]="today" class="form-control">
            </div>
          </div>
        </fieldset>

        <fieldset class="vstack gap-4 mt-4">
          <legend class="h5 fw-semibold text-dark mb-3">Professional Details</legend>
          <div class="row g-3">
            <div class="col-md-6">
                <label for="department" class="form-label">Department <span class="text-danger">*</span></label>
                <select id="department" [(ngModel)]="teacher.details.departmentId" name="department" required class="form-select">
                  <option value="" disabled>Select Department</option>
                  @for(dept of departments; track dept.id || dept._id) {
                    <option [value]="dept.id || dept._id">{{ dept.name }}</option>
                  }
                </select>
            </div>
            <div class="col-md-6">
                <label for="specialization" class="form-label">Specialization</label>
                <input id="specialization" type="text" [(ngModel)]="teacher.details.specialization" name="specialization" class="form-control" placeholder="e.g., Machine Learning">
            </div>
          </div>
        </fieldset>

        <div class="d-flex justify-content-end pt-4 mt-4 border-top">
            <button type="submit" [disabled]="!teacherForm.valid" class="btn btn-success d-flex align-items-center">
              <i class="fas fa-save me-2"></i>Save Teacher
            </button>
        </div>
      </form>
    </div>
  </div>
} @else {
  <p class="text-center text-muted">Loading teacher details...</p>
}

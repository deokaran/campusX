<div class="card shadow-sm">
  <div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="card-title h3">Manage Teachers</h2>
      <a routerLink="add" class="btn btn-primary btn-sm d-flex align-items-center">
        <i class="fas fa-plus me-2"></i>Add Teacher
      </a>
    </div>
    
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th class="text-muted small">Name</th>
            <th class="text-muted small">Teacher ID</th>
            <th class="text-muted small">Department</th>
            <th class="text-muted small text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for(teacher of teachers; track getTeacherId(teacher)) {
            <tr>
              <td class="fw-semibold text-dark">{{ getTeacherName(teacher) }}</td>
              <td class="text-secondary">{{ getTeacherId(teacher) }}</td>
              <td class="text-secondary">{{ getDepartmentName(teacher.details?.departmentId) }}</td>
              <td class="text-center">
                <a [routerLink]="['edit', getTeacherId(teacher)]" 
                   class="btn btn-sm btn-outline-primary me-2" 
                   title="Edit">
                  <i class="fas fa-pencil-alt"></i>
                </a>
                <button (click)="deleteTeacher(teacher)" 
                        class="btn btn-sm btn-outline-danger" 
                        title="Delete">
                  <i class="fas fa-trash"></i>
                </button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="text-center text-muted p-4">
                There are no teachers to display.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>


<div class="card shadow-sm">
  <div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="card-title h3">Manage Notices</h2>
      <button (click)="openAddModal()" class="btn btn-primary btn-sm d-flex align-items-center" data-bs-toggle="modal" data-bs-target="#noticeModal">
        <i class="fas fa-plus me-2"></i>Add New Notice
      </button>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th class="text-muted small">Date</th>
            <th class="text-muted small">Title</th>
            <th class="text-muted small">Category</th>
            <th class="text-muted small text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for(notice of notices; track notice.title) {
            <tr>
              <td class="fw-semibold text-dark">{{ notice.date | date:'longDate' }}</td>
              <td class="text-secondary">{{ notice.title }}</td>
              <td>
                <span class="badge"
                  [class.text-bg-primary]="notice.category === 'Academic'"
                  [class.text-bg-secondary]="notice.category === 'Administrative'"
                  [class.text-bg-warning]="notice.category === 'Event'"
                  [class.text-bg-light]="notice.category === 'Other'">
                  {{ notice.category }}
                </span>
              </td>
              <td class="text-center">
                <button (click)="openEditModal(notice)" class="btn btn-sm btn-outline-primary me-2" title="Edit Notice" data-bs-toggle="modal" data-bs-target="#noticeModal">
                      <i class="fas fa-pencil-alt"></i>
                </button>
                <button (click)="deleteNotice(notice.title)" class="btn btn-sm btn-outline-danger" title="Delete Notice">
                      <i class="fas fa-trash"></i>
                </button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="text-center text-muted p-4">No notices have been created yet.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add/Edit Notice Modal -->
<div class="modal fade" id="noticeModal" tabindex="-1" aria-labelledby="noticeModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form #noticeForm="ngForm" (ngSubmit)="saveNotice()">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="noticeModalLabel">{{ isEditMode ? 'Edit Notice' : 'Add New Notice' }}</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" (click)="closeModal()"></button>
        </div>
        <div class="modal-body vstack gap-3">
          <div>
            <label for="noticeTitle" class="form-label">Title</label>
            <input type="text" id="noticeTitle" name="noticeTitle" [(ngModel)]="currentNotice.title" required class="form-control">
          </div>
          <div>
            <label for="noticeDate" class="form-label">Date</label>
            <input type="date" id="noticeDate" name="noticeDate" [(ngModel)]="currentNotice.date" required [min]="minDate" [max]="maxDate" class="form-control">
          </div>
          <div>
            <label for="noticeCategory" class="form-label">Category</label>
            <select id="noticeCategory" name="noticeCategory" [(ngModel)]="currentNotice.category" required class="form-select">
              <option>Academic</option>
              <option>Administrative</option>
              <option>Event</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" (click)="closeModal()">Cancel</button>
          <button type="submit" [disabled]="!noticeForm.form.valid" class="btn btn-primary" data-bs-dismiss="modal">Save Notice</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="login-container">
  <div class="text-center text-white mb-5">
    <div class="d-flex align-items-center justify-content-center gap-3">
      <app-logo [size]="60"></app-logo>
      <div>
        <h1 class="display-5 fw-bold">Welcome to CampusX!</h1>
        <p class="lead">Your integrated educational portal.</p>
      </div>
    </div>
  </div>

  <div class="card login-card shadow-lg">
    <div class="row g-0">
      <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center bg-light p-5">
        <app-logo [size]="250"></app-logo>
      </div>

      <div class="col-md-6">
        <div class="card-body p-4 p-lg-5">
          <ul class="nav nav-tabs nav-fill mb-4">
            <li class="nav-item">
              <button class="nav-link" (click)="selectTab('S')" [class.active]="activeTab === 'S'"
                [class.student-tab]="activeTab === 'S'">Student</button>
            </li>
            <li class="nav-item">
              <button class="nav-link" (click)="selectTab('T')" [class.active]="activeTab === 'T'"
                [class.teacher-tab]="activeTab === 'T'">Teacher</button>
            </li>
            <li class="nav-item">
              <button class="nav-link" (click)="selectTab('A')" [class.active]="activeTab === 'A'"
                [class.admin-tab]="activeTab === 'A'">Admin</button>
            </li>
          </ul>

          <h2 class="h4 fw-bold text-center mb-4">{{ loginTitle }}</h2>

          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <input id="userId" name="userId" type="text" required [(ngModel)]="userId"
                class="form-control form-control-lg" [placeholder]="userIdPlaceholder">
            </div>
            <div class="mb-3">
              <input id="password" name="password" [type]="showPassword ? 'text' : 'password'" required
                [(ngModel)]="password" class="form-control form-control-lg" placeholder="Enter Password">
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input id="showPassword" name="showPassword" type="checkbox" [(ngModel)]="showPassword"
                  class="form-check-input">
                <label for="showPassword" class="form-check-label small">Show Password</label>
              </div>
              <a routerLink="/forgot-password" class="small text-decoration-none">Forgot Password?</a>
            </div>

            @if (error) {
            <p class="text-center text-danger small">{{ error }}</p>
            }

            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">
                Login
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

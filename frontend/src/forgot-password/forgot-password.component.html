
<div class="forgot-password-container">
  <div class="card shadow-lg" style="max-width: 28rem;">
    <div class="card-body p-5">
      <div class="text-center mb-4">
          <h1 class="h3 fw-bold text-dark">Reset Password</h1>
          <p class="text-muted small">
            @if (step === 'request') {
              Enter your User ID to receive an OTP.
            } @else {
              Enter the OTP and your new password.
            }
          </p>
      </div>

      <form (ngSubmit)="onSubmit()">
          <div class="mb-3">
              <input 
                  id="userId" 
                  name="userId" 
                  type="text" 
                  required 
                  [(ngModel)]="userId"
                  [disabled]="step === 'reset'"
                  class="form-control form-control-lg" 
                  placeholder="Enter your User ID"
              >
          </div>
          
          @if (step === 'reset') {
              <div class="vstack gap-3">
                  <div class="mb-3">
                      <input 
                          id="otp" 
                          name="otp" 
                          type="text" 
                          required 
                          [(ngModel)]="otp"
                          class="form-control form-control-lg" 
                          placeholder="Enter 4-Digit OTP"
                      >
                  </div>
                  <div class="mb-3">
                      <input 
                          id="newPassword" 
                          name="newPassword" 
                          [type]="showPassword ? 'text' : 'password'" 
                          required 
                          [(ngModel)]="newPassword"
                          class="form-control form-control-lg" 
                          placeholder="Enter New Password"
                      >
                  </div>
                  <div class="mb-3">
                      <input 
                          id="confirmPassword" 
                          name="confirmPassword" 
                          [type]="showPassword ? 'text' : 'password'" 
                          required 
                          [(ngModel)]="confirmPassword"
                          class="form-control form-control-lg" 
                          placeholder="Confirm New Password"
                      >
                  </div>
                  
                  <div class="d-flex justify-content-between align-items-center small">
                      <div class="form-check">
                          <input id="showPassword" name="showPassword" type="checkbox" [(ngModel)]="showPassword" class="form-check-input">
                          <label for="showPassword" class="form-check-label">Show Passwords</label>
                      </div>
                      <button type="button" (click)="goBackToRequest()" class="btn btn-link btn-sm text-decoration-none">
                          <i class="fas fa-arrow-left me-1"></i>Change User ID
                      </button>
                  </div>
              </div>
          }
          
          @if (error) {
            <div class="alert alert-danger small p-2 mt-3 text-center">{{ error }}</div>
          }
          @if (successMessage) {
            <div class="alert alert-success small p-2 mt-3 text-center">{{ successMessage }}</div>
          }
          
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary btn-lg">
              {{ step === 'request' ? 'Send OTP' : 'Reset Password' }}
            </button>
          </div>
      </form>
      <div class="text-center mt-4">
          <a routerLink="/login" class="small text-decoration-none">
              <i class="fas fa-arrow-left me-1"></i> Back to Login
          </a>
      </div>
    </div>
  </div>
</div>
